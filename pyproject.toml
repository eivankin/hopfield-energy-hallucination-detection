[project]
name = "hallucination-hopfield-study"
version = "0.1.0"
description = "Attention-derived Hopfield energy experiments for context-grounded hallucination detection."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.10.9",
    "numpy>=1.24",
    "pandas>=1.5",
    "scikit-learn>=1.3",
    "seaborn>=0.13.2",
    "torch==2.6.0",
    "tqdm>=4.65",
    "transformers>=4.57",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]
public-data = [
    "datasets>=3.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
